name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual run from any branch: builds and pushes the image tagged with the branch name
  workflow_dispatch:

# Read-only token by default; jobs that publish ask for more themselves
permissions:
  contents: read

env:
  IMAGE: ghcr.io/dodert/accounts-balance-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the whole history: the test report shows when each test was added and changed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Chromium for the end-to-end tests (tests/test_e2e.py), with the system libraries it needs
      - run: python -m playwright install --with-deps chromium
      # -v: one line per test in the log; the JUnit report becomes a table on the run's Summary page.
      # E2E=1: the end-to-end tests fail instead of being skipped if the browser can't start
      - run: pytest -v --junitxml=test-results.xml
        env:
          E2E: "1"
      - name: Test report
        if: ${{ !cancelled() }}
        run: python scripts/test_summary.py test-results.xml >> "$GITHUB_STEP_SUMMARY"
      # A screenshot of the page at the end of each end-to-end test, passed or failed: the run's Artifacts
      - name: Screenshots of the end-to-end tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      # The same screenshots in one page, uploaded unzipped
      - name: Screenshots page
        if: ${{ !cancelled() && hashFiles('test-screenshots/*.png') != '' }}
        run: python scripts/e2e_gallery.py test-results.xml test-screenshots e2e-screenshots.html
      - name: Upload the screenshots page
        if: ${{ !cancelled() && hashFiles('test-screenshots/*.png') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: e2e-screenshots.html
          archive: false
          retention-days: 14

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # SemVer: main builds are the release version from app/__init__.py (e.g. 0.5.0);
      # any other branch gets a pre-release of it, X.Y.Z-<branch>.<run> (e.g. 0.5.0-feat-bulk-scrape.27),
      # which sorts below the release and never takes a main version number
      # Branch names go through env, never straight into the script (a crafted name can't inject commands)
      - id: app
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ] || [ "$REF_TYPE" = "tag" ]; then
            version=$base
          else
            slug=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
            version=$base-$slug.$RUN_NUMBER
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$base" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.app.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.app.outputs.minor }},enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=pre-release,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
            type=raw,value=${{ steps.app.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.app.outputs.version }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
