<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="asset-version" content="{{ASSET_VERSION}}">
  <title>Accounts Balance Tracker</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0a66c2">
  <link rel="stylesheet" href="/static/style.css?v={{ASSET_VERSION}}">
</head>
<body class="login-page">
  <div class="login-box admin-box">
    <h1 data-i18n="admin.title">Administration</h1>
    <h2 data-i18n="admin.users">Users</h2>
    {{SUMMARY}}
    {{USERS}}
    <h2 data-i18n="admin.invitations">Invitations</h2>
    {{NEW_LINK}}
    <form method="post" action="/admin/invitations">
      <label><span data-i18n="admin.invite_email">Email (optional: only this email can use the link)</span> <input name="email" type="email"></label>
      <button type="submit" class="primary" data-i18n="admin.invite">Create invitation link</button>
    </form>
    <h3 data-i18n="admin.open_invitations">Open invitations</h3>
    {{INVITATIONS}}
    <h2 data-i18n="admin.blocked_emails">Blocked emails</h2>
    <p class="totp-help" data-i18n="admin.blocked_help">These emails can't create an account, even with an invitation.</p>
    {{BLOCKED}}
    <form method="post" action="/admin/blocked-emails">
      <label><span data-i18n="admin.email">Email</span> <input name="email" type="email" required></label>
      <button type="submit" data-i18n="admin.block_email">Block email</button>
    </form>
    <form method="post" action="/logout"><button type="submit" data-i18n="header.logout">Log out</button></form>
    <p class="attribution"><a href="https://db-ip.com" target="_blank" rel="noopener">IP Geolocation by DB-IP</a></p>
  </div>
  <script src="/static/i18n.js?v={{ASSET_VERSION}}"></script>
  <script src="/static/pages.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
