services:
  accounts-balance-tracker:
    image: ghcr.io/dodert/accounts-balance-tracker:latest
    container_name: accounts-balance-tracker
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      # Currency for new accounts
      - DEFAULT_CURRENCY=EUR
      # Optional: use PostgreSQL instead of SQLite
      # - DATABASE_URL=postgresql+psycopg://balances:balances@postgres:5432/balances
      # Login: set both to turn it on (recommended: this app holds financial data)
      - AUTH_USERNAME=
      - AUTH_PASSWORD=
      - AUTH_TOTP=false
      # Optional: several users, each with their own encrypted database (AUTH_* above = the admin)
      # - MULTI_USER=true
      # Optional: reverse proxies whose X-Forwarded-For is trusted (default: local and Docker networks)
      # - FORWARDED_ALLOW_IPS=172.18.0.5
    restart: unless-stopped
